<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f7fb">
<title>הכלים שלי</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#f5f7fb}
body{color:#172033;font-family:Arial,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.app{width:100%;max-width:760px;margin:auto;padding:18px 14px 35px}
.header{margin-bottom:18px}
.top-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 22px rgba(99,102,241,.22);overflow:hidden}
.brand-icon img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.brand-icon.logo-loaded{background:#fff;border:1px solid #e7eaf1}
.brand-text h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.5px;font-family:inherit;} /* נוסף font-family:inherit כדי לוודא התאמה מלאה */
.brand-text p{margin:3px 0 0;color:#7a8498;font-size:12px}
.count{padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700;color:#5b54c8;background:#eeedff;border:1px solid #dedbff}
.search-box{margin-top:17px;position:relative}
.search-box input{width:100%;height:46px;border:1px solid #e1e5ed;border-radius:14px;outline:none;background:#fff;color:#172033;padding:0 43px 0 14px;font-size:14px;box-shadow:0 4px 14px rgba(24,32,51,.04)}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;color:#8993a6;pointer-events:none}
.categories{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:14px 1px 5px}
.categories::-webkit-scrollbar{display:none}
.category{flex:0 0 auto;border:1px solid #e1e5ed;background:#fff;color:#788398;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600}
.category.active{color:#fff;background:linear-gradient(135deg,#6366f1,#7c3aed);border-color:transparent;box-shadow:0 5px 14px rgba(99,102,241,.2)}
.tools-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tool{min-width:0;position:relative;padding:13px;border-radius:17px;background:#fff;border:1px solid #e5e8ef;box-shadow:0 5px 18px rgba(24,32,51,.055);transition:.18s;overflow:hidden}
.tool::before{content:"";position:absolute;width:75px;height:75px;top:-40px;left:-35px;border-radius:50%;background:var(--accent-soft);pointer-events:none}
.tool:active{transform:scale(.97)}
.tool-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:10px}
.tool-icon{width:39px;height:39px;flex:0 0 39px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:19px;background:var(--accent-soft);border:1px solid var(--accent-border)}
.arrow{color:#a2aabd;font-size:16px}
.tool h2{margin:0;font-size:14px;line-height:1.3;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#202a3d}
.tool p{margin:5px 0 0;color:#7b8598;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;margin-top:10px;padding:4px 7px;border-radius:6px;background:#f4f5f8;color:#8a94a6;font-size:9px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:35px 10px;color:#7c879a;font-size:13px}
.footer{text-align:center;margin-top:24px;color:#a2aabd;font-size:10px}
@media(max-width:350px){.app{padding-left:10px;padding-right:10px}.tools-grid{gap:7px}.tool{padding:10px;border-radius:14px}.tool-icon{width:35px;height:35px;flex-basis:35px}.tool h2{font-size:13px}.tool p{font-size:10px}}
@media(min-width:700px){.app{padding-top:30px}.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="top-line">
<div class="brand">
<div class="brand-icon" id="brandLogo"><span>⚡</span></div>
<div class="brand-text"><h1>הכלים שלי</h1><p>כלים שימושיים במקום אחד</p></div>
</div>
<div class="count" id="count">19 כלים</div>
</div>
<div class="search-box"><span class="search-icon">⌕</span><input type="search" id="search" placeholder="חיפוש כלי..." autocomplete="off"></div>
<div class="categories">
<button class="category active" data-category="all">הכל</button>
<button class="category" data-category="tool">כלים</button>
<button class="category" data-category="game">משחקים</button>
</div>
</header>
<main class="tools-grid" id="toolsGrid"></main>
<div class="footer">נבנה באהבה ❤️</div>
</div>
<script>
const LOGO_PATH="logo.png";
const brandLogo=document.getElementById("brandLogo");
const img=new Image();
img.onload=()=>{brandLogo.innerHTML="";brandLogo.appendChild(img);brandLogo.classList.add("logo-loaded")};
img.onerror=()=>{brandLogo.innerHTML="<span>⚡</span>"};
img.src=LOGO_PATH;

const tools=[
{id:"StockIt",title:"Stock and Shopping list",description:"רשימת קניות ומלאי לבית.",category:"tool",icon:"🛒",color:"#7957d5",url:"https://joock3r.github.io/StockIt/"},
{id:"Coupons",title:"Coupons",description:"ניהול קופונים",category:"tool",icon:"💰",color:"#ed3d5b",url:"https://joock3r.github.io/Coupons/"},
{id:"Locki",title:"Password Manager",description:"ניהול סיסמאות",category:"tool",icon:"🔒",color:"#ef9d20",url:"https://joock3r.github.io/Locki/"},
{id:"predicto",title:"Predicto",description:"ניהול הימורי מונדיאל ויורו בין חברים.",category:"tool",icon:"🎯",color:"#3bf78a",url:"https://joock3r.github.io/Predicto/"},
{id:"whatsapp",title:"WhatsApp Tool",description:"כלי שימושי ליצירת שיחות וקישורים בוואטסאפ.",category:"tool",icon:"💬",color:"#7957d5",url:"https://joock3r.github.io/WhatsApp/"},
{id:"Vaad",title:"Vaad Cash Flow",description:"כלי מעקב הוצאות והכנסות ועד כיתה א2.",category:"tool",icon:"💰",color:"#ed3d5b",url:"https://joock3r.github.io/Vaad/"},
{id:"cookbook",title:"CookBook",description:"מתכונים וכלי בישול מסודרים במקום אחד.",category:"tool",icon:"🍳",color:"#ef9d20",url:"https://joock3r.github.io/CookBook/"},
{id:"weight",title:"Weight Tracker",description:"מעקב משקל והתקדמות לאורך זמן.",category:"tool",icon:"⚖️",color:"#3bf78a",url:"https://joock3r.github.io/WeightTracker/"},
{id:"calio",title:"Calories Tracker",description:"מעקב אחר צריכת קלוריות.",category:"tool",icon:"💪",color:"#7957d5",url:"https://joock3r.github.io/Calio/"},
{id:"tracking",title:"מעקב משלוחים",description:"מעקב גלובלי אחרי משלוחים מחברות שונות.",category:"tool",icon:"📦",color:"#ed3d5b",url:"https://17track.net/"},
{id:"pais",title:"מפעל הפיס",description:"בדיקה מהירה של תוצאות הגרלות.",category:"tool",icon:"🎰",color:"#ef9d20",url:"https://joock3r.github.io/Pais/"},
{id:"party",title:"קיר ברכות",description:"איסוף ברכות מאורחים ותיעוד אירועים.",category:"tool",icon:"🎉",color:"#3bf78a",url:"https://joock3r.github.io/Party/"},
{id:"trip",title:"טיולית",description:"מתכנן טיולים חכם לכל הפרטים שבדרך.",category:"tool",icon:"✈️",color:"#7957d5",url:"https://joock3r.github.io/TripAdvisor/"},
{id:"pizza",title:"מחשבון בצק",description:"חישוב מדויק לבצק פיצה נאפוליטנית.",category:"tool",icon:"🍕",color:"#ed3d5b",url:"https://joock3r.github.io/Pizza/"},
{id:"conversion",title:"כלי המרה",description:"המרה בין יחידות מידה בינלאומיות.",category:"tool",icon:"💱",color:"#ef9d20",url:"https://joock3r.github.io/Conversion/"},
{id:"flags",title:"Flags",description:"משחק ניחוש דגלי מדינות מרחבי העולם.",category:"game",icon:"🌍",color:"#3bf78a",url:"https://joock3r.github.io/Flags/"},
{id:"heat-hunt",title:"Heat Hunt",description:"ניחוש מדינה בעזרת רמזי חם וקר.",category:"game",icon:"🌡",color:"#7957d5",url:"https://joock3r.github.io/HeatHunt/"},
{id:"nasdaq",title:"בורסה חינוכית",description:"משחק מסחר לתרגול וקבלת החלטות.",category:"game",icon:"📈",color:"#ed3d5b",url:"https://joock3r.github.io/NASDAQ/"},
{id:"sudoku",title:"מיני סודוקו",description:"תשבץ מספרים יפני המבוסס על היגיון.",category:"game",icon:"🧩",color:"#ef9d20",url:"https://joock3r.github.io/Sudoku/"}
];

const grid=document.getElementById("toolsGrid"),search=document.getElementById("search"),count=document.getElementById("count");
let currentCategory="all";

function hexToRgba(hex,a){
const v=hex.replace("#","");
const r=parseInt(v.substring(0,2),16),g=parseInt(v.substring(2,4),16),b=parseInt(v.substring(4,6),16);
return `rgba(${r},${g},${b},${a})`;
}

function renderTools(){
const q=search.value.trim().toLowerCase();
const filtered=tools.filter(t=>
(currentCategory==="all"||t.category===currentCategory)&&
(t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q))
);
grid.innerHTML="";
if(!filtered.length){
grid.innerHTML='<div class="empty">🔎<br><br>לא נמצאו כלים מתאימים</div>';
}else{
filtered.forEach(t=>{
const card=document.createElement("a");
card.className="tool";
card.href=t.url;
card.target="_blank";
card.rel="noopener noreferrer";
card.style.setProperty("--accent",t.color);
card.style.setProperty("--accent-soft",hexToRgba(t.color,.09));
card.style.setProperty("--accent-border",hexToRgba(t.color,.16));
card.innerHTML=`<div class="tool-top"><div class="tool-icon">${t.icon}</div><div class="arrow">←</div></div><h2>${t.title}</h2><p>${t.description}</p><span class="tag">${t.category==="game"?"משחק":"כלי"}</span>`;
grid.appendChild(card);
});
}
count.textContent=`${filtered.length} ${filtered.length===1?"כלי":"כלים"}`;
}

search.addEventListener("input",renderTools);
document.querySelectorAll(".category").forEach(btn=>btn.addEventListener("click",()=>{
document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
currentCategory=btn.dataset.category;
renderTools();
}));
renderTools();
</script>
</body>
</html>
