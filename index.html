<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="הפרויקטים, הכלים והמשחקים של Tamir - כולם במקום אחד.">
  <meta name="theme-color" content="#f6f7f2">
  <title>TSRICKER | Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{color-scheme:light;--bg:#f6f7f2;--surface:#fff;--surface2:#eceee7;--ink:#171916;--muted:#696d65;--line:#d9ddd3;--brand:#ffcf24;--blue:#176bff;--shadow:0 14px 36px rgba(31,40,29,.09);--header:rgba(246,247,242,.88)}
    html[data-theme="dark"]{color-scheme:dark;--bg:#121411;--surface:#1b1e1a;--surface2:#242821;--ink:#f2f4ed;--muted:#a5aa9e;--line:#343930;--brand:#ffd434;--blue:#6b9dff;--shadow:0 18px 46px rgba(0,0,0,.28);--header:rgba(18,20,17,.88)}
    html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),var(--bg);background-size:64px 64px;color:var(--ink);font-family:"Heebo",sans-serif;transition:background-color .18s,color .18s}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
    .site-header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:var(--header);backdrop-filter:blur(18px)}
    .nav,main,.footer-inner{width:min(1180px,calc(100% - 40px));margin-inline:auto}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:inline-flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;direction:ltr;font-family:"Space Grotesk",sans-serif;font-weight:700}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--brand);box-shadow:3px 3px 0 var(--ink);font-size:.88rem}
    .icon-button{width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .16s,border-color .16s}.icon-button:hover{transform:translateY(-2px);border-color:var(--ink)}.icon-button svg{width:19px}
    .intro{min-height:205px;padding:30px 0 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px;border-bottom:1px solid var(--line)}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;color:var(--blue);font-size:.72rem;font-weight:800;text-transform:uppercase}.eyebrow::before{content:"";width:24px;height:3px;background:currentColor}
    h1{max-width:860px;margin:0;font-size:clamp(2.2rem,5vw,4rem);font-weight:800;line-height:1;letter-spacing:0}h1 span{display:inline;color:transparent;-webkit-text-stroke:1.5px var(--ink)}.intro-copy{max-width:650px;margin:12px 0 0;color:var(--muted);font-size:.95rem;line-height:1.5}
    .project-count{width:104px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--brand);color:#171916;box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg)}.project-count strong{font-family:"Space Grotesk",sans-serif;font-size:2.45rem;line-height:1}.project-count span{margin-top:4px;font-size:.7rem;font-weight:700}
    .directory{padding:22px 0 64px}.directory-toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto;align-items:center;gap:14px;margin-bottom:16px}.search-wrap{position:relative}.search-wrap svg{position:absolute;top:50%;right:14px;width:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}.search-input{width:100%;height:44px;padding:0 44px 0 14px;border:1px solid var(--line);border-radius:6px;outline:0;background:var(--surface);color:var(--ink);transition:border-color .16s,box-shadow .16s}.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}.search-input::placeholder{color:var(--muted)}
    .filters{display:flex;gap:6px}.filter-button{min-height:40px;padding:7px 15px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}.filter-button:hover{border-color:var(--ink);color:var(--ink)}.filter-button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
    .results-line{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:700}.project-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .project-card{position:relative;min-height:170px;display:flex;flex-direction:column;padding:16px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);color:var(--ink);animation:card-in .44s both;transition:transform .18s,box-shadow .18s,border-color .18s}.project-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--card-color)}.project-card:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:var(--shadow)}.card-link{position:absolute;inset:0;z-index:1}.card-link:focus-visible,.favorite-button:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:-4px}
    .card-top,.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-top{align-items:flex-start}.project-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-size:1.25rem}.favorite-button{position:relative;z-index:2;width:30px;height:30px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}.favorite-button:hover{background:var(--surface2);color:var(--ink)}.favorite-button.is-favorite{color:#e7ad00}.favorite-button.is-favorite svg{fill:currentColor}.favorite-button svg{width:16px}
    .project-card h2{margin:14px 0 4px;font-size:1rem;line-height:1.2}.project-card p{margin:0;color:var(--muted);font-size:.79rem;line-height:1.4}.card-footer{margin-top:auto;padding-top:13px}.category-label{color:var(--blue);font-size:.68rem;font-weight:800}.launch-icon{width:16px;transition:transform .18s}.project-card:hover .launch-icon{transform:translate(-3px,-3px)}
    .empty-state{display:none;padding:60px 20px;border:1px dashed var(--line);text-align:center;color:var(--muted)}.empty-state.is-visible{display:block}.empty-state strong{display:block;margin-bottom:6px;color:var(--ink);font-size:1.1rem}footer{border-top:1px solid var(--line);background:var(--surface)}.footer-inner{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--muted);font-size:.82rem}.footer-inner a{color:var(--ink);font-weight:700;text-decoration:none}.footer-inner a:hover{text-decoration:underline}
    @keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:1050px){.project-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:820px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{gap:22px}}
    @media(max-width:680px){.nav,main,.footer-inner{width:min(100% - 28px,1180px)}.nav{height:62px}.brand-text{font-size:.88rem}.intro{min-height:auto;padding:26px 0 22px;grid-template-columns:minmax(0,1fr) auto;gap:14px}h1{font-size:clamp(2rem,10vw,2.8rem)}.intro-copy{font-size:.84rem}.project-count{width:82px}.project-count strong{font-size:2rem}.project-count span{font-size:.62rem}.directory{padding-top:18px}.directory-toolbar{grid-template-columns:1fr}.filters{width:100%;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.project-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.project-card{min-height:176px;padding:12px}.project-icon{width:36px;height:36px;font-size:1.1rem}.favorite-button{width:28px;height:28px}.project-card h2{margin-top:12px;font-size:.9rem}.project-card p{font-size:.72rem;line-height:1.35}.card-footer{padding-top:10px}.footer-inner{min-height:110px;flex-direction:column;justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav" aria-label="ניווט ראשי"><a class="brand" href="#top" aria-label="TSRICKER Projects - דף הבית"><span class="brand-mark">TS</span><span class="brand-text">TSRICKER.COM</span></a><button class="icon-button" id="themeToggle" type="button" aria-label="החלפת ערכת צבעים" title="ערכת צבעים"><i data-lucide="moon"></i></button></nav></header>
  <main id="top">
    <section class="intro" aria-labelledby="pageTitle"><div><p class="eyebrow">Digital playground</p><h1 id="pageTitle">הפרויקטים <span>של תמיר.</span></h1><p class="intro-copy">כלים שימושיים, משחקים וניסויים קטנים שבניתי כדי לפתור בעיות, ללמוד וליהנות בדרך.</p></div><div class="project-count" aria-label="מספר הפרויקטים"><strong id="projectCount">0</strong><span>פרויקטים באוויר</span></div></section>
    <section class="directory" aria-label="ספריית פרויקטים">
      <div class="directory-toolbar"><label class="search-wrap"><i data-lucide="search"></i><span hidden>חיפוש פרויקט</span><input class="search-input" id="searchInput" type="search" placeholder="חיפוש לפי שם או תיאור..." autocomplete="off"></label><div class="filters" role="group" aria-label="סינון פרויקטים"><button class="filter-button" type="button" data-filter="all" aria-pressed="true">הכל</button><button class="filter-button" type="button" data-filter="tool" aria-pressed="false">כלים</button><button class="filter-button" type="button" data-filter="game" aria-pressed="false">משחקים</button><button class="filter-button" type="button" data-filter="favorite" aria-pressed="false">מועדפים</button></div></div>
      <div class="results-line" aria-live="polite"><span id="resultsCount"></span><span>לחיצה על כרטיס תפתח את הפרויקט</span></div><div class="project-grid" id="projectGrid"></div><div class="empty-state" id="emptyState"><strong>לא מצאתי פרויקט מתאים</strong><span>אפשר לנסות חיפוש אחר או לבחור קטגוריה אחרת.</span></div>
    </section>
  </main>
  <footer><div class="footer-inner"><span>נבנה על ידי Tamir · <span id="year"></span></span><a href="https://github.com/joock3r" target="_blank" rel="noopener noreferrer">GitHub / joock3r</a></div></footer>
  <script>
    const projects=[
      {id:"shopping-list",title:"Shopping List",description:"רשימת קניות חכמה, מהירה ונוחה לשימוש.",category:"tool",icon:"🛒",color:"#25a45b",url:"https://joock3r.github.io/ShoppingList/"},
      {id:"Coupons",title:"Coupons",description:"ניהול קופונים",category:"tool",icon:"💰",color:"#ed3d5b",url:"https://joock3r.github.io/Coupons/"},
      {id:"predicto",title:"Predicto",description:"ניהול הימורי מונדיאל ויורו בין חברים.",category:"tool",icon:"🎯",color:"#ed3d5b",url:"https://joock3r.github.io/Predicto/"},
      {id:"whatsapp",title:"WhatsApp Tool",description:"כלי שימושי ליצירת שיחות וקישורים בוואטסאפ.",category:"tool",icon:"💬",color:"#25d366",url:"https://joock3r.github.io/WhatsApp/"},
      {id:"cookbook",title:"CookBook",description:"מתכונים וכלי בישול מסודרים במקום אחד.",category:"tool",icon:"🍳",color:"#ef9d20",url:"https://joock3r.github.io/CookBook/"},
      {id:"weight",title:"Weight Tracker",description:"מעקב משקל והתקדמות לאורך זמן.",category:"tool",icon:"⚖️",color:"#176bff",url:"https://joock3r.github.io/WeightTracker/"},
      {id:"tracking",title:"מעקב משלוחים",description:"מעקב גלובלי אחרי משלוחים מחברות שונות.",category:"tool",icon:"📦",color:"#167c80",url:"https://17track.net/"},
      {id:"pais",title:"מפעל הפיס",description:"בדיקה מהירה של תוצאות הגרלות.",category:"tool",icon:"🎰",color:"#d74976",url:"https://joock3r.github.io/Pais/"},
      {id:"party",title:"קיר ברכות",description:"איסוף ברכות מאורחים ותיעוד אירועים.",category:"tool",icon:"🎉",color:"#e53f68",url:"https://joock3r.github.io/Party/"},
      {id:"trip",title:"טיולית",description:"מתכנן טיולים חכם לכל הפרטים שבדרך.",category:"tool",icon:"✈️",color:"#278acb",url:"https://joock3r.github.io/TripAdvisor/"},
      {id:"pizza",title:"מחשבון בצק",description:"חישוב מדויק לבצק פיצה נאפוליטנית.",category:"tool",icon:"🍕",color:"#dc4934",url:"https://joock3r.github.io/Pizza/"},
      {id:"conversion",title:"כלי המרה",description:"המרה בין יחידות מידה בינלאומיות.",category:"tool",icon:"💱",color:"#248c71",url:"https://joock3r.github.io/Conversion/"},
      {id:"euro",title:"Euro 2028",description:"משחק תחזיות ליורו באנגליה, סקוטלנד, וויילס ואירלנד.",category:"tool",icon:"⚽",color:"#2165d6",url:"https://joock3r.github.io/Competition/"},
      {id:"flags",title:"Flags",description:"משחק ניחוש דגלי מדינות מרחבי העולם.",category:"game",icon:"🌍",color:"#e4473b",url:"https://joock3r.github.io/Flags/"},
      {id:"heat-hunt",title:"Heat Hunt",description:"ניחוש מדינה בעזרת רמזי חם וקר.",category:"game",icon:"🌡️",color:"#16a085",url:"https://joock3r.github.io/HeatHunt/"},
      {id:"nasdaq",title:"בורסה חינוכית",description:"משחק מסחר לתרגול וקבלת החלטות.",category:"game",icon:"📈",color:"#176bff",url:"https://joock3r.github.io/NASDAQ/"},
      {id:"sudoku",title:"מיני סודוקו",description:"תשבץ מספרים יפני המבוסס על היגיון.",category:"game",icon:"🧩",color:"#7957d5",url:"https://joock3r.github.io/Sudoku/"}
    ];
    const storage={get(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}};
    const state={filter:"all",query:"",favorites:new Set(storage.get("tsricker.favorites.v1",[]))};
    const grid=document.getElementById("projectGrid"),resultsCount=document.getElementById("resultsCount"),emptyState=document.getElementById("emptyState"),searchInput=document.getElementById("searchInput"),themeToggle=document.getElementById("themeToggle");
    function escapeHtml(value){const element=document.createElement("span");element.textContent=value;return element.innerHTML}
    function visibleProjects(){const query=state.query.trim().toLocaleLowerCase("he");return projects.filter(project=>{const matches=state.filter==="all"||project.category===state.filter||(state.filter==="favorite"&&state.favorites.has(project.id));return matches&&`${project.title} ${project.description}`.toLocaleLowerCase("he").includes(query)})}
    function renderProjects(){const visible=visibleProjects();grid.innerHTML=visible.map((project,index)=>{const favorite=state.favorites.has(project.id),category=project.category==="tool"?"כלי":"משחק";return `<article class="project-card" style="--card-color:${project.color};animation-delay:${Math.min(index*35,280)}ms"><a class="card-link" href="${project.url}" target="_blank" rel="noopener noreferrer" aria-label="פתיחת ${escapeHtml(project.title)}"></a><span class="card-top"><span class="project-icon" aria-hidden="true">${project.icon}</span><button class="favorite-button${favorite?" is-favorite":""}" type="button" data-favorite="${project.id}" aria-label="${favorite?"הסרה מהמועדפים":"הוספה למועדפים"}" title="${favorite?"הסרה מהמועדפים":"הוספה למועדפים"}"><i data-lucide="star"></i></button></span><h2>${escapeHtml(project.title)}</h2><p>${escapeHtml(project.description)}</p><span class="card-footer"><span class="category-label">${category}</span><i class="launch-icon" data-lucide="arrow-up-left" aria-hidden="true"></i></span></article>`}).join("");resultsCount.textContent=`${visible.length} ${visible.length===1?"פרויקט":"פרויקטים"}`;emptyState.classList.toggle("is-visible",!visible.length);grid.hidden=!visible.length;if(window.lucide)lucide.createIcons()}
    function setTheme(theme){document.documentElement.dataset.theme=theme;storage.set("tsricker.theme.v1",theme);const dark=theme==="dark";themeToggle.innerHTML=`<i data-lucide="${dark?"sun":"moon"}"></i>`;themeToggle.setAttribute("aria-label",dark?"מעבר למצב בהיר":"מעבר למצב כהה");document.querySelector('meta[name="theme-color"]').content=dark?"#121411":"#f6f7f2";if(window.lucide)lucide.createIcons()}
    document.querySelector(".filters").addEventListener("click",event=>{const button=event.target.closest("[data-filter]");if(!button)return;state.filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));renderProjects()});
    grid.addEventListener("click",event=>{const button=event.target.closest("[data-favorite]");if(!button)return;event.preventDefault();event.stopPropagation();const id=button.dataset.favorite;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);storage.set("tsricker.favorites.v1",[...state.favorites]);renderProjects()});
    searchInput.addEventListener("input",()=>{state.query=searchInput.value;renderProjects()});themeToggle.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
    const savedTheme=storage.get("tsricker.theme.v1",null),preferredTheme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";setTheme(savedTheme||preferredTheme);document.getElementById("projectCount").textContent=projects.length;document.getElementById("year").textContent=new Date().getFullYear();renderProjects();
  </script>
</body>
</html>
